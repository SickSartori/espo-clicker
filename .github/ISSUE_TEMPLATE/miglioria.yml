name: Miglioria
description: Qualcosa che c'è già e potrebbe andare meglio
title: "Miglioria: "
labels: ["miglioria"]
body:
  - type: textarea
    id: cosa
    attributes:
      label: Cosa si può migliorare
    validations:
      required: true
  - type: textarea
    id: perche
    attributes:
      label: Perché
      description: Cosa non va oggi, o cosa risulterebbe più comodo.
  - type: dropdown
    id: dove
    attributes:
      label: Dove
      options:
        - Clicker e team
        - Negozio e skin
        - Sala giochi
        - Amici e classifica
        - Obiettivi, Prestige e Formattazione
        - Opzioni e interfaccia
        - Altro
    validations:
      required: true

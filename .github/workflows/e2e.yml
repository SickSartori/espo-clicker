name: E2E (Playwright)

# Rete di sicurezza dello strangler V3: parità V3↔legacy + smoke gameplay sul
# gioco reale (index.php in Chromium headless). Stessi trigger di quality.yml:
# ogni PR e ogni push tranne il mirror di deploy 'test'.
on:
  pull_request:
  push:
    branches-ignore:
      - test

jobs:
  e2e:
    name: 🎭 Parità + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build legacy + v3
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # e2e-server.js crea php/config.php da example (assente in CI) e serve il gioco.
      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

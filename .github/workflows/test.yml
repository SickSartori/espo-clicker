name: Deploy to test Server FTP 🛠️

# 1. Quando eseguire il workflow
on:
  push:
    branches:
      - test

# 2. Definisci il Job (l'attività)
jobs:
  deploy:
    name: Distribuzione FTP
    runs-on: ubuntu-latest # Esegui il job su una macchina virtuale Linux

    # 3. Steps del Job
    steps:
      # Step 1: Checkout del codice
      - name: Checkout del codice sorgente
        uses: actions/checkout@v4 # Scarica i file dalla repository

      # Step 1b: Build bundle (dist-v3/ è gitignored → va generato qui)
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dipendenze
        run: npm ci

      - name: 🏗️ Build (legacy esbuild + v3 Vite)
        run: npm run build

      - name: 🔧 Set config to DEV
        run: |
          sed -i 's/"instanceName" => "production"/"instanceName" => "dev"/' php/config.php
          # Cheatboard SEMPRE attiva in test: svuota prodHost cosi' HTTP_HOST != prodHost
          # e' sempre vero (il test gira sullo stesso dominio della prod).
          sed -i 's/"prodHost" => "[^"]*"/"prodHost" => ""/' php/config.php
          grep "prodHost" php/config.php

      # Step 2: Caricamento FTP
      # NOTA: Per un progetto PHP/JS come questo, non è richiesto un passo di build.
      # L'azione FTP caricherà direttamente tutti i file scaricati.
      - name: Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            **/*.map
            docs/**
            src/**
            scripts/**
            assets/sounds/music/**
            assets/video/**
            music/songs/**
            package.json
            package-lock.json
            build.js
            bump-version.js
            vite.config.ts
            tsconfig.json
            .lighthouserc.json
            deploy.bat
            deploy-ui.bat
            README.md
            php/config.example.php
            php/r2-config.example.php
            php/r2-cors-policy.json
name: Deploy to test Server FTP 🛠️

# 1. Quando eseguire il workflow
on:
  push:
    branches:
      - test

# 2. Definisci il Job (l'attività)
jobs:
  deploy:
    name: Distribuzione FTP
    runs-on: ubuntu-latest # Esegui il job su una macchina virtuale Linux

    # 3. Steps del Job
    steps:
      # Step 1: Checkout del codice
      - name: Checkout del codice sorgente
        uses: actions/checkout@v4 # Scarica i file dalla repository

      # MODIFICA: Aggiornato per gestire config.php (PHP) invece di config.json
      # Usa 'sed' per cercare la chiave "instanceName" e impostarla a "dev"
      - name: 🔧 Set config to DEV
        run: |
          sed -i 's/"instanceName" => ".*"/"instanceName" => "dev"/' code/php/config.php

      # Step 2: Caricamento FTP
      - name: Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@master
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          local-dir: ./code/ # MODIFICA: Carica solo il contenuto della cartella 'code'
          exclude: |
            **/.git*
            **/.git*/**
            .github/**

name: Deploy to test Server FTP 🛠️

# 1. Quando eseguire il workflow
on:
  push:
    branches:
      - test

# 2. Definisci il Job (l'attività)
jobs:
  deploy:
    name: Distribuzione FTP
    runs-on: ubuntu-latest # Esegui il job su una macchina virtuale Linux

    # 3. Steps del Job
    steps:
      # Step 1: Checkout del codice
      - name: Checkout del codice sorgente
        uses: actions/checkout@v5 # Scarica i file dalla repository

      # Step 1b: Build bundle (dist/ è gitignored → va generato qui)
      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dipendenze
        run: npm ci

      - name: 🏗️ Build (legacy esbuild + v3 Vite)
        run: npm run build

      - name: 🔧 Set config to DEV
        run: |
          sed -i 's/"instanceName" => "production"/"instanceName" => "dev"/' php/config.php
          # Cheatboard SEMPRE attiva in test: svuota prodHost cosi' HTTP_HOST != prodHost
          # e' sempre vero (il test gira sullo stesso dominio della prod).
          sed -i 's/"prodHost" => "[^"]*"/"prodHost" => ""/' php/config.php
          grep "prodHost" php/config.php

      # Step 2: Caricamento FTP
      # ⚠️ FTP_REMOTE_PATH e' il percorso dell'AREA DI TEST (sottocartella /test/),
      #    non della produzione: quella sta nella root FTP e la gestisce main.yml
      #    con server-dir "./". Ripuntare questo secret alla produzione significa
      #    sovrascrivere il sito live al primo push su questo branch.
      # NB: il build serve eccome (dist/ e' gitignored) ed e' lo step qui sopra;
      #     la vecchia nota "non è richiesto un passo di build" era rimasta dalla v2.
      - name: Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          log-level: verbose
          # Come in main.yml: gli SFX restano come fallback locale (~900 KB),
          # arcade-theme.mp3 no — 10 MB di musica in loop, l'unica traccia fuori
          # da assets/sounds/music/ e quindi l'unica che sfuggiva al filtro.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            **/*.map
            dev/**
            src/**
            scripts/**
            assets/sounds/music/**
            assets/sounds/arcade/arcade-theme.mp3
            assets/video/**
            music/songs/**
            package.json
            package-lock.json
            vite.config.ts
            tsconfig.json
            playwright.config.ts
            test-results/**
            .lighthouserc.json
            deploy.bat
            deploy-ui.bat
            README.md
            PRODUCT.md
            php/config.example.php
            php/r2-config.example.php
            php/trello-config.example.php
            php/r2-cors-policy.json
name: Deploy to Production 🏭

# 1. Quando eseguire il workflow
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy'
        required: false
        default: 'Uscita versione #.#'

# 2. Definizione del Job
jobs:
  deploy-production:
    name: 🚀 Distribuzione Manuale FTP
    runs-on: ubuntu-latest

    steps:
      # Step 1: Scarica il codice dal branch selezionato nel menu a tendina
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Step 1b: Build bundle (dist-v3/ è gitignored → va generato qui)
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dipendenze
        run: npm ci

      - name: 🏗️ Build (legacy esbuild + v3 Vite)
        run: npm run build

      # Step 2: Forza la configurazione su PRODUCTION
      - name: 🔧 Set config to PRODUCTION
        run: |
          echo "Impostazione ambiente su PRODUCTION..."

          # Imposta instanceName=production in config.php
          sed -i 's/"instanceName" => "dev"/"instanceName" => "production"/' php/config.php

          # Estrae devVersion e prodVersion da config.php e aggiorna sw.js
          DEV_VER=$(grep -oP '"devVersion" => "\K[^"]+' php/config.php)
          PROD_VER=$(grep -oP '"prodVersion" => "\K[^"]+' php/config.php)
          echo "Sostituzione versione SW: $DEV_VER → $PROD_VER"
          sed -i "s/espo-v${DEV_VER}/espo-v${PROD_VER}/g" sw.js
          sed -i "s/v=${DEV_VER}/v=${PROD_VER}/g" sw.js

          # Verifica
          grep "instanceName" php/config.php
          grep "CACHE_VERSION" sw.js

      # Step 3: Rimuovi file di sviluppo/cheat
      - name: 🗑️ Rimuovi file di debug (cheatboard.js)
        run: rm -f js/cheatboard.js

      # Step 4: Caricamento FTP
      # NOTA: Assicurati che FTP_REMOTE_PATH punti alla cartella di produzione (es. public_html)
      - name: 📂 Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.DS_Store
            node_modules/**
            **/*.map
            docs/**
            src/**
            scripts/**
            assets/sounds/music/**
            assets/video/**
            music/songs/**
            package.json
            package-lock.json
            build.js
            bump-version.js
            vite.config.ts
            tsconfig.json
            .lighthouserc.json
            deploy.bat
            deploy-ui.bat
            README.md
            php/config.example.php
            php/r2-config.example.php
            php/r2-cors-policy.json
name: Deploy to Production 🏭

# 1. Quando eseguire il workflow
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy'
        required: false
        default: 'Uscita versione #.#'

# 2. Definisci il Job (l'attività)
jobs:
  deploy:
    name: Distribuzione FTP
    runs-on: ubuntu-latest # Esegui il job su una macchina virtuale Linux

    # 3. Steps del Job
    steps:
      # Step 1: Checkout del codice
      - name: Checkout del codice sorgente
        uses: actions/checkout@v4 # Scarica i file dalla repository

      - name: 🔧 Set config to PRODUCTION
        run: |
          jq '.instancename = "production"' php/config.json > php/config.tmp && mv php/config.tmp php/config.json

      # Step 2: Caricamento FTP
      # NOTA: Per un progetto PHP/JS come questo, non è richiesto un passo di build.
      # L'azione FTP caricherà direttamente tutti i file scaricati.
      - name: Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@master
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
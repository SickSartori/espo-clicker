name: Deploy to Production 🏭

# 1. Quando eseguire il workflow
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy'
        required: false
        default: 'Uscita versione #.#'

# 2. Definizione del Job
jobs:
  deploy-production:
    name: 🚀 Distribuzione Manuale FTP
    runs-on: ubuntu-latest

    steps:
      # Step 1: Scarica il codice dal branch selezionato nel menu a tendina
      - name: Checkout del codice
        uses: actions/checkout@v5

      # Step 1b: Build bundle (dist/ è gitignored → va generato qui)
      - name: 🟢 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dipendenze
        run: npm ci

      - name: 🏗️ Build (legacy esbuild + v3 Vite)
        run: npm run build

      # Step 2: Forza la configurazione su PRODUCTION
      - name: 🔧 Set config to PRODUCTION
        run: |
          echo "Impostazione ambiente su PRODUCTION..."

          # Imposta instanceName=production in config.php. Fallisce se il pattern
          # non aggancia: meglio un deploy interrotto che uno in dev-mode online.
          grep -q '"instanceName" => "dev"' php/config.php \
            || { echo "::error::instanceName non e' 'dev' in php/config.php: deploy annullato"; exit 1; }
          sed -i 's/"instanceName" => "dev"/"instanceName" => "production"/' php/config.php

          # NB: qui NON si riscrive piu' CACHE_VERSION in sw.js.
          # Lo faceva un sed che sostituiva espo-v${devVersion} con espo-v${prodVersion}:
          # essendo le due versioni sempre uguali in config.php, sostituiva una stringa
          # con se' stessa — un no-op che dava l'illusione di invalidare la cache.
          # La sorgente di verita' e' sw.js, aggiornato da scripts/bump-version.js
          # insieme a package.json e config.php. Se serve invalidare, si bumpa prima
          # del deploy (npm run cache:bump) e si committa.
          grep "instanceName" php/config.php
          grep "CACHE_VERSION" sw.js

      # Step 3: Rimuovi file di sviluppo/cheat
      - name: 🗑️ Rimuovi file di debug (cheatboard.js)
        run: rm -f js/cheatboard.js

      # Step 4: Caricamento FTP
      # ⚠️ PRODUZIONE va nella root FTP ("./"), NON in FTP_REMOTE_PATH.
      #    FTP_REMOTE_PATH e' il percorso dell'area di TEST e lo usa solo test.yml
      #    (server-dir li'). Non ripuntarlo alla produzione "per coerenza": il primo
      #    push su test sovrascriverebbe il sito live.
      #    server-dir e' esplicitato qui anche se coincide col default, cosi' la
      #    differenza fra i due workflow si legge senza doverla dedurre.
      - name: 📂 Caricamento FTP su Server
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          # Gli SFX sotto assets/sounds/ restano caricati apposta: servono da
          # fallback locale quando la signed URL R2 non e' disponibile
          # (CDN.urlSync(path) || path). Sono ~900 KB in tutto.
          # arcade-theme.mp3 invece no: e' una traccia musicale da 10 MB
          # (type: 'music', loop), l'unica che sta fuori da assets/sounds/music/
          # e che quindi sfuggiva al filtro qui sotto. Da sola valeva il 92% dei
          # suoni spediti via FTP, e per la musica il fallback locale non esiste
          # comunque: se R2 non risponde tacciono anche tutti gli altri temi.
          # assets/image/future/**: bozzetti delle skin non ancora cablate in
          # src/data/skins.ts, ~30 MB di PNG che nessuna pagina richiede. Restano
          # versionati, ma non hanno motivo di salire sul server a ogni deploy.
          # NB: i commenti stanno QUI e non dentro `exclude: |` — in un blocco YAML
          # letterale il '#' non commenta, finirebbe all'azione come pattern glob.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/.DS_Store
            node_modules/**
            **/*.map
            dev/**
            src/**
            scripts/**
            assets/sounds/music/**
            assets/sounds/arcade/arcade-theme.mp3
            assets/video/**
            assets/image/future/**
            music/songs/**
            package.json
            package-lock.json
            vite.config.ts
            tsconfig.json
            playwright.config.ts
            test-results/**
            .lighthouserc.json
            deploy.bat
            deploy-ui.bat
            README.md
            PRODUCT.md
            php/config.example.php
            php/r2-config.example.php
            php/trello-config.example.php
            php/r2-cors-policy.json